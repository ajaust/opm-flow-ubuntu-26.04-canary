name: OPM Flow canary (Ubuntu 26.04)

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_OPM_VERSION: "2026.04" # minimum acceptable year.month

jobs:
  canary:
    name: Install OPM Flow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install OPM Flow from the OPM PPA
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y software-properties-common ca-certificates
          sudo apt-add-repository -y ppa:opm/ppa
          sudo apt-get update
          sudo apt-get install -y mpi-default-bin libopm-simulators-bin python3-opm-common

      - name: Report and check installed version
        run: |
          set -e
          PKG=libopm-simulators-bin
          POLICY=$(apt-cache policy $PKG)
          ARCH=$(dpkg-query -W -f='${Architecture}' $PKG)
          VARIANT=$(dpkg -s $PKG | sed -n 's/^Architecture-Variant: //p')
          VARIANT=${VARIANT:-none (plain amd64)}
          PKG_VERSION=$(dpkg-query -W -f='${Version}' $PKG)
          FLOW_VERSION=$(flow --version)
          CONFIGURED=$(apt-config dump | grep -i 'Architecture-Variants' || echo "not set (apt default)")
          {
            echo "### OPM Flow canary"
            echo "- flow --version: \`$FLOW_VERSION\`"
            echo "- package version: \`$PKG_VERSION\`"
            echo "- dpkg architecture: \`$ARCH\`"
            echo "- **installed variant: \`$VARIANT\`**"
            echo "- apt config: \`$CONFIGURED\`"
            echo '```'
            echo "$POLICY"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          # Compare year.month of the package version against the expectation
          INSTALLED=$(echo "$PKG_VERSION" | grep -oE '^[0-9]{4}\.[0-9]{2}' || true)
          if [ -z "$INSTALLED" ] || [ "$(printf '%s\n%s\n' "$EXPECTED_OPM_VERSION" "$INSTALLED" | sort -V | head -n1)" != "$EXPECTED_OPM_VERSION" ]; then
            echo "::error::Installed OPM Flow $PKG_VERSION (variant: $VARIANT) is older than expected $EXPECTED_OPM_VERSION"
            exit 1
          fi
